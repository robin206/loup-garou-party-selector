<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loup-Garou - Projecteur</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }
    #fallback-background {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }
    video.layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: transparent;
      z-index: 1;
      transition: opacity 350ms ease;
    }
    .controls {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      opacity: 0.25;
      transition: opacity 0.2s ease;
      cursor: default;
    }
    .controls:hover { opacity: 1; }
    .controls button {
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: system-ui, sans-serif;
    }
    .controls button:hover { background: rgba(0, 0, 0, 0.85); }
    .controls button.active { background: rgba(255, 255, 255, 0.85); color: #000; }

    /* ===== Role card overlay ===== */
    .role-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.85) 100%);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 400ms ease;
    }
    .role-overlay.visible { opacity: 1; }
    .role-card {
      height: 50vh;
      aspect-ratio: 3 / 4;
      background: linear-gradient(160deg, #f5e6c8 0%, #e8cf9a 45%, #c9a86a 100%);
      border: 6px solid #3a2a10;
      border-radius: 24px;
      box-shadow:
        0 0 0 2px rgba(255, 220, 150, 0.4) inset,
        0 30px 60px rgba(0, 0, 0, 0.75),
        0 0 80px rgba(255, 200, 100, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4vh 3vh;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      color: #2a1a05;
      transform: scale(0.85) rotate(-2deg);
      transition: transform 500ms cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 300ms ease;
      position: relative;
    }
    .role-overlay.visible .role-card { transform: scale(1) rotate(0deg); }
    .role-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px solid rgba(58, 42, 16, 0.55);
      border-radius: 16px;
      pointer-events: none;
    }
    .role-card img {
      max-height: 60%;
      max-width: 85%;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
      transition: opacity 200ms ease;
    }
    .role-card .role-name {
      margin-top: 3vh;
      font-size: 4vh;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 0 rgba(255,255,255,0.35), 0 3px 6px rgba(0,0,0,0.25);
      transition: opacity 200ms ease;
    }
    .role-card.swapping img,
    .role-card.swapping .role-name { opacity: 0; }

    /* ===== Players side columns ===== */
    .players-column {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 11vw;
      min-width: 90px;
      max-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1vh;
      padding: 2vh 0.5vw;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(
        to var(--edge, right),
        rgba(0, 0, 0, 0.55) 0%,
        rgba(0, 0, 0, 0.25) 60%,
        rgba(0, 0, 0, 0) 100%
      );
    }
    .players-column.left { left: 0; --edge: right; }
    .players-column.right { right: 0; --edge: left; }
    .players-column.hidden { display: none; }
    .player-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-family: "Cinzel", Georgia, serif;
      color: #f5e6c8;
      transition: opacity 300ms ease, filter 300ms ease;
    }
    .player-card .avatar {
      width: 7vw;
      max-width: 110px;
      min-width: 70px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f5e6c8, #c9a86a);
      border: 3px solid #3a2a10;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6),
        inset 0 0 0 2px rgba(255, 220, 150, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .player-card.team-werewolf .avatar {
      background: radial-gradient(circle at 30% 30%, #7a1f1f, #2a0505);
      border-color: #4a0000;
    }
    .player-card.team-village .avatar {
      background: radial-gradient(circle at 30% 30%, #cfe5ff, #4a7ec1);
      border-color: #12365e;
    }
    .player-card.team-solo .avatar {
      background: radial-gradient(circle at 30% 30%, #ffe8a3, #b58619);
      border-color: #6a4a08;
    }
    .player-card .avatar img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
    }
    .player-card .label {
      font-size: 1.6vh;
      text-align: center;
      line-height: 1.1;
      max-width: 100%;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      word-break: break-word;
    }
    .player-card .label .role-label {
      font-size: 1.2vh;
      opacity: 0.75;
      display: block;
    }
    .player-card.dead {
      filter: grayscale(1) brightness(0.55);
      opacity: 0.55;
    }
    .player-card.dead .avatar {
      position: relative;
    }
    .player-card.dead .avatar::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(45deg, transparent 46%, rgba(180, 0, 0, 0.85) 48%, rgba(180, 0, 0, 0.85) 52%, transparent 54%),
        linear-gradient(-45deg, transparent 46%, rgba(180, 0, 0, 0.85) 48%, rgba(180, 0, 0, 0.85) 52%, transparent 54%);
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <!--
    Fichiers vidéo attendus dans /public/videos/ :
      - village_loop.mp4            (DAY loop)
      - foret_nuit_loop.mp4         (NIGHT loop)
      - transition_jour_nuit.mp4    (DAY -> NIGHT transition)
      - transition_nuit_jour.mp4    (NIGHT -> DAY transition)
  -->
  <div id="fallback-background"></div>
    <video id="video-loop" class="layer" autoplay loop muted playsinline></video>
    <video id="video-transition" class="layer" style="display:none" muted playsinline></video>

  <div id="role-overlay" class="role-overlay" aria-hidden="true">
    <div id="role-card" class="role-card">
      <img id="role-image" src="" alt="" />
      <div id="role-name" class="role-name"></div>
    </div>
  </div>

  <div class="controls" aria-label="Contrôles manuels">
    <button data-mode="DAY">Jour</button>
    <button data-mode="NIGHT">Nuit</button>
  </div>

  <script>
    const LOOPS = {
      DAY: "/videos/village_loop.mp4",
      NIGHT: "/videos/foret_nuit_loop.mp4",
    };
    const TRANSITIONS = {
      "DAY->NIGHT": "/videos/transition_jour_nuit.mp4",
      "NIGHT->DAY": "/videos/transition_nuit_jour.mp4",
    };
    const LAST_FRAMES = {
      DAY: "/videos/jour_last_frame.jpg",
      NIGHT: "/videos/nuit_last_frame.jpg"
    };

    const loopEl = document.getElementById("video-loop");
    const transEl = document.getElementById("video-transition");
    const backgroundEl = document.getElementById("fallback-background");
    const buttons = document.querySelectorAll(".controls button");

    let currentMode = null;
    let isTransitioning = false;

    function updateButtons() {
      buttons.forEach(b => b.classList.toggle("active", b.dataset.mode === currentMode));
    }

    async function playLoop(mode) {
      setBackground(mode);
      loopEl.style.opacity = "0";    
      loopEl.src = LOOPS[mode];
      loopEl.load();
      loopEl.loop = true;
    
      await waitForCanPlay(loopEl);
    
      loopEl.style.display = "";
      transEl.style.display = "none";   
      loopEl.play().catch(() => {});
    
      requestAnimationFrame(() => {
        loopEl.style.opacity = "1";
      });
    
      transEl.removeAttribute("src");
    
      currentMode = mode;
    
      updateButtons();
    }

    async function playTransitionThen(fromTo, nextMode) {
    
      const src = TRANSITIONS[fromTo];
    
      if (!src) {
        playLoop(nextMode);
        return;
      }
    
      isTransitioning = true;
    
      setBackground(currentMode);
    
      transEl.style.opacity = "0";
    
      transEl.src = src;
      transEl.load();
      transEl.loop = false;
      transEl.style.display = "";
    
      await waitForCanPlay(transEl);
    
      requestAnimationFrame(() => {
        transEl.style.opacity = "1";
      });
    
      loopEl.style.display = "none";
    
      const onEnded = async () => {
    
        transEl.removeEventListener("ended", onEnded);
    
        await playLoop(nextMode);
    
        isTransitioning = false;
      };
    
      const onError = async () => {

        transEl.removeEventListener("ended", onEnded);
        transEl.removeEventListener("error", onError);
      
        await playLoop(nextMode);
      
        isTransitioning = false;
      };
    
      transEl.addEventListener("ended", onEnded);
      transEl.addEventListener("error", onError);
    
      transEl.play().catch(async () => {
    
        await playLoop(nextMode);
    
        isTransitioning = false;
    
      });
    }

    function setMode(mode) {
      if (mode !== "DAY" && mode !== "NIGHT") return;
      if (isTransitioning) return;
      if (mode === currentMode) return;

      if (currentMode === "DAY" && mode === "NIGHT") {
        playTransitionThen("DAY->NIGHT", "NIGHT");
      } else if (currentMode === "NIGHT" && mode === "DAY") {
        playTransitionThen("NIGHT->DAY", "DAY");
      } else {
        // Aucun état courant (chargement initial) : lancer direct la boucle
        playLoop(mode);
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });

    // ===== Role card overlay =====
    const overlayEl = document.getElementById("role-overlay");
    const cardEl = document.getElementById("role-card");
    const roleImgEl = document.getElementById("role-image");
    const roleNameEl = document.getElementById("role-name");
    let currentRoleId = null;

    function applyRole(roleId, roleName, roleIcon) {
      currentRoleId = roleId;
      roleImgEl.src = roleIcon || "";
      roleImgEl.alt = roleName || "";
      roleNameEl.textContent = roleName || "";
    }

    function showRoleCard(roleId, roleName, roleIcon) {
      if (overlayEl.classList.contains("visible") && currentRoleId !== roleId) {
        // Transition douce entre deux cartes
        cardEl.classList.add("swapping");
        setTimeout(() => {
          applyRole(roleId, roleName, roleIcon);
          cardEl.classList.remove("swapping");
        }, 200);
      } else {
        applyRole(roleId, roleName, roleIcon);
        overlayEl.classList.add("visible");
        overlayEl.setAttribute("aria-hidden", "false");
      }
    }

    function hideRoleCard() {
      overlayEl.classList.remove("visible");
      overlayEl.setAttribute("aria-hidden", "true");
      currentRoleId = null;
    }
    
    function setBackground(mode) {
      const image = LAST_FRAMES[mode];
    
      if (!image) return;
    
      backgroundEl.style.backgroundImage =
        `url('${image}')`;
    }
    
    function waitForCanPlay(video) {
      return new Promise(resolve => {
    
        if (video.readyState >= 3) {
          resolve();
          return;
        }
    
        const done = () => {
          video.removeEventListener("canplay", done);
          resolve();
        };
    
        video.addEventListener("canplay", done);
      });
    }

    // BroadcastChannel sync avec l'app principale
    try {
      const channel = new BroadcastChannel("loupgarou-projector");
      channel.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || !data.type) return;
        if (data.type === "CHANGE_PROJECTOR_MODE") {
          if (data.mode === "DAY" || data.mode === "NIGHT") setMode(data.mode);
          return;
        }
        if (data.type === "SHOW_ROLE_CARD") {
          showRoleCard(data.roleId, data.roleName, data.roleIcon);
          return;
        }
        if (data.type === "HIDE_ROLE_CARD") {
          hideRoleCard();
          return;
        }
      });
    } catch (e) {
      console.warn("BroadcastChannel non supporté:", e);
    }

    // Mode initial : JOUR en boucle
    [
      "/videos/village_loop.mp4",
      "/videos/foret_nuit_loop.mp4",
      "/videos/transition_jour_nuit.mp4",
      "/videos/transition_nuit_jour.mp4"
    ].forEach(src => {
      const v = document.createElement("video");
      v.preload = "auto";
      v.src = src;
    });
    playLoop("DAY");
  </script>
</body>
</html>
